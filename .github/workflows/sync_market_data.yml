name: ⚡ Real-Time Market Sync (Per-Minute via cron-job.org)

on:
  repository_dispatch:
    types: [market-sync-trigger]
  schedule:
    # Fallback: every 5 minutes during trading hours (Sun-Thu 07:00-12:00 UTC = 10:00-15:00 Cairo)
    - cron: '*/5 7-12 * * 0,1,2,3,4'
  workflow_dispatch:

concurrency:
  group: market-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Real-Time Prices from Mubasher
        run: |
          python << 'EOF'
          import requests, json, re, os
          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor

          cairo_tz = timezone(timedelta(hours=3))
          now = datetime.now(cairo_tz)
          print(f"[{now.strftime('%H:%M:%S')}] Starting Mubasher real-time sync...")

          SESSION = requests.Session()
          SESSION.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': 'https://english.mubasher.info/',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
          })

          STOCKS = [
              'TMGH','SWDY','ORAS','ISPH','ETEL','AMOC','ABUK','MFPC','SKPC',
              'JUFO','EFID','ADIB','SAUD','OCDI','PHDC','COMI','FWRY','EFIH',
              'EGAL','ORHD','MCQE','ACGC','ARCC','ATQA','RMDA','GBCO',
              'LCSW','DOMTY','CLHO','HELI','MNHD','CIEB','ESRS','MACRO'
          ]

          def parse_num(s, default=0.0):
              try:
                  return float(re.sub(r'[^\d.\-]', '', s or ''))
              except:
                  return default

          def fetch_stock(ticker):
              url = f'https://english.mubasher.info/markets/EGX/stocks/{ticker}/'
              try:
                  r = SESSION.get(url, timeout=8)
                  h = r.text

                  # Extract price & change
                  pm  = re.search(r'market-summary__last-price[^"]*">\s*([0-9,.]+)\s*<', h)
                  cm  = re.search(r'market-summary__change-percentage[^"]*">\s*([-+]?[0-9,.]+%?)\s*<', h)
                  chv = re.search(r'market-summary__change-value[^"]*">\s*([-+]?[0-9,.]+)\s*<', h)

                  # OHLV — try multiple patterns
                  def block(label):
                      m = re.search(
                          label + r'[\s\S]{0,200}?market-summary__block-number[^>]*>\s*([0-9,.]+)\s*<',
                          h, re.IGNORECASE)
                      return parse_num(m.group(1)) if m else 0.0

                  close = parse_num(pm.group(1)) if pm else 0.0
                  if close <= 0:
                      return None

                  chg_str = re.sub(r'[^\d.\-+]', '', cm.group(1)) if cm else '0'
                  chg = float(chg_str) if chg_str else 0.0

                  open_  = block('Open')   or close
                  high   = block('High')   or close
                  low    = block('Low')    or close
                  vol_m  = re.search(r'Volume[\s\S]{0,200}?market-summary__block-number[^>]*>\s*([\d,]+)\s*<', h)
                  volume = int(re.sub(r'[^\d]', '', vol_m.group(1))) if vol_m else 0

                  return {
                      'ticker': ticker,
                      'close': round(close, 2),
                      'chg':   round(chg, 2),
                      'open':  round(open_ or close, 2),
                      'high':  round(high  or close, 2),
                      'low':   round(low   or close, 2),
                      'volume': volume,
                      'source': 'mubasher.info',
                      'ts': now.strftime('%H:%M:%S'),
                  }
              except Exception as e:
                  print(f'  WARN {ticker}: {e}')
                  return None

          # Parallel fetch with 12 workers
          results = {}
          with ThreadPoolExecutor(max_workers=12) as ex:
              for res in ex.map(fetch_stock, STOCKS):
                  if res:
                      results[res['ticker']] = res

          print(f"Mubasher fetched: {len(results)}/{len(STOCKS)} stocks")

          # ── Fetch EGX Index ──────────────────────────────────
          indices = {}
          for name, slug in [('EGX30','EGX30'), ('EGX33','EGX33'), ('EGX70','EGX70%20EWI')]:
              try:
                  url = f'https://english.mubasher.info/markets/EGX/indices/{slug}'
                  r = SESSION.get(url, timeout=6)
                  pm = re.search(r'market-summary__last-price[^"]*">\s*([0-9,.]+)\s*<', r.text)
                  cm = re.search(r'market-summary__change-percentage[^"]*">\s*([-+]?[0-9,.]+%?)\s*<', r.text)
                  if pm:
                      p = parse_num(pm.group(1))
                      c = float(re.sub(r'[^\d.\-+]', '', cm.group(1))) if cm else 0.0
                      indices[name] = {'close': p, 'chgPct': round(c, 2)}
                      print(f'  Index {name}: {p} ({c:+.2f}%)')
              except Exception as e:
                  print(f'  WARN index {name}: {e}')

          # ── Load existing market_data.json ───────────────────
          try:
              with open('market_data.json', 'r', encoding='utf-8') as f:
                  mdata = json.load(f)
          except:
              mdata = {'stocks': {}, 'funds': {}, 'indices': {}, 'fx_gold': {}}

          # ── Update stocks ────────────────────────────────────
          if 'stocks' not in mdata:
              mdata['stocks'] = {}
          for ticker, d in results.items():
              if ticker not in mdata['stocks']:
                  mdata['stocks'][ticker] = {}
              mdata['stocks'][ticker].update(d)

          # ── Update indices ───────────────────────────────────
          if 'indices' not in mdata:
              mdata['indices'] = {}
          mdata['indices'].update(indices)
          if 'EGX33' in indices:
              mdata['indices']['EGX33'] = indices['EGX33']

          # ── Timestamp ────────────────────────────────────────
          mdata['updated_at']         = now.isoformat()
          mdata['updated_at_display'] = now.strftime('%Y-%m-%d %H:%M:%S')
          mdata['data_source']        = 'Mubasher.info Live'
          mdata['sync_count']         = len(results)

          with open('market_data.json', 'w', encoding='utf-8') as f:
              json.dump(mdata, f, ensure_ascii=False, indent=2)

          print(f"✅ market_data.json updated — {len(results)} stocks at {now.strftime('%H:%M:%S')}")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "EGX-Bot"
          git config --global user.email "bot@egx-sharia.org"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "⚡ Live Prices $(date +'%H:%M:%S') [skip ci]" && \
            git push origin main
