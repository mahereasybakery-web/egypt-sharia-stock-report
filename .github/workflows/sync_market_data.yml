name: ⚡ Per-Minute Live Price Sync (Self-Looping)

on:
  schedule:
    # Runs every 5 minutes during EGX trading hours (Sun-Thu 07:00-12:00 UTC = 10:00-15:00 Cairo)
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-12 * * 0,1,2,3,4'
  workflow_dispatch:
  repository_dispatch:
    types: [market-sync-trigger]

concurrency:
  group: market-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-prices-per-minute:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Loop — Fetch & Push Every 60 Seconds (x5 iterations)
        run: |
          python << 'PYEOF'
          import requests, json, re, subprocess, time, os
          from datetime import datetime, timezone, timedelta
          from concurrent.futures import ThreadPoolExecutor

          cairo_tz = timezone(timedelta(hours=3))

          STOCKS = [
              'TMGH','SWDY','ORAS','ISPH','ETEL','AMOC','ABUK','MFPC','SKPC',
              'JUFO','EFID','ADIB','SAUD','OCDI','PHDC','COMI','FWRY','EFIH',
              'EGAL','ORHD','MCQE','ACGC','ARCC','ATQA','RMDA','GBCO',
              'LCSW','HELI','CIEB','ESRS','CLHO','MACRO','MNHD','DOMTY'
          ]

          SESSION = requests.Session()
          SESSION.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': 'https://english.mubasher.info/',
          })

          def parse_num(s, default=0.0):
              try:
                  return float(re.sub(r'[^\d.\-]', '', str(s) or ''))
              except:
                  return default

          def fetch_stock(ticker):
              url = f'https://english.mubasher.info/markets/EGX/stocks/{ticker}/'
              try:
                  r = SESSION.get(url, timeout=9)
                  h = r.text
                  pm  = re.search(r'market-summary__last-price[^"]*">\s*([0-9,.]+)\s*<', h)
                  cm  = re.search(r'market-summary__change-percentage[^"]*">\s*([-+]?[0-9,.]+%?)\s*<', h)
                  def block(label):
                      m = re.search(label + r'[\s\S]{0,300}?market-summary__block-number[^>]*>\s*([0-9,.]+)\s*<', h, re.IGNORECASE)
                      return parse_num(m.group(1)) if m else 0.0
                  close = parse_num(pm.group(1)) if pm else 0.0
                  if close <= 0: return None
                  chg_s = re.sub(r'[^\d.\-+]', '', cm.group(1)) if cm else '0'
                  chg   = float(chg_s) if chg_s else 0.0
                  open_ = block('Open') or close
                  high  = block('High') or close
                  low   = block('Low')  or close
                  vm    = re.search(r'Volume[\s\S]{0,300}?market-summary__block-number[^>]*>\s*([\d,]+)\s*<', h)
                  vol   = int(re.sub(r'[^\d]', '', vm.group(1))) if vm else 0
                  return {'ticker': ticker, 'close': round(close,2), 'chg': round(chg,2),
                          'open': round(open_,2), 'high': round(high,2), 'low': round(low,2),
                          'volume': vol, 'source': 'mubasher.info'}
              except Exception as e:
                  print(f'  WARN {ticker}: {e}')
                  return None

          def fetch_indices():
              idx = {}
              for name, slug in [('EGX30','EGX30'),('EGX70','EGX70%20EWI')]:
                  try:
                      r = SESSION.get(f'https://english.mubasher.info/markets/EGX/indices/{slug}', timeout=8)
                      pm = re.search(r'market-summary__last-price[^"]*">\s*([0-9,.]+)\s*<', r.text)
                      cm = re.search(r'market-summary__change-percentage[^"]*">\s*([-+]?[0-9,.]+%?)\s*<', r.text)
                      if pm:
                          p = parse_num(pm.group(1))
                          c = float(re.sub(r'[^\d.\-+]','',cm.group(1))) if cm else 0.0
                          idx[name] = {'close': p, 'chgPct': round(c,2)}
                  except: pass
              return idx

          def git_commit_push(ts_str, count):
              try:
                  subprocess.run(['git','config','user.name','EGX-Bot'], check=True)
                  subprocess.run(['git','config','user.email','bot@egx-sharia.org'], check=True)
                  subprocess.run(['git','add','market_data.json'], check=True)
                  diff = subprocess.run(['git','diff','--staged','--quiet'])
                  if diff.returncode != 0:
                      subprocess.run(['git','commit','-m',f'⚡ {ts_str} — {count} stocks [skip ci]'], check=True)
                      subprocess.run(['git','push','origin','main'], check=True)
                      print(f'  [GIT] Pushed at {ts_str}')
                  else:
                      print(f'  [GIT] No changes at {ts_str}')
              except Exception as e:
                  print(f'  [GIT ERROR] {e}')

          # ── MAIN LOOP: 5 iterations × 60s = ~5 minutes ──────
          for iteration in range(5):
              now = datetime.now(cairo_tz)
              ts  = now.strftime('%H:%M:%S')
              print(f'\n{"="*50}')
              print(f'[Iteration {iteration+1}/5] {ts}')

              # Fetch all stocks in parallel
              results = {}
              with ThreadPoolExecutor(max_workers=14) as ex:
                  for res in ex.map(fetch_stock, STOCKS):
                      if res:
                          results[res['ticker']] = res

              indices = fetch_indices()
              print(f'  Fetched: {len(results)} stocks | EGX30={indices.get("EGX30",{}).get("close","?")}')

              # Load & merge market_data.json
              try:
                  with open('market_data.json', 'r', encoding='utf-8') as f:
                      mdata = json.load(f)
              except:
                  mdata = {'stocks': {}, 'funds': {}, 'indices': {}, 'fx_gold': {}}

              if 'stocks' not in mdata: mdata['stocks'] = {}
              for ticker, d in results.items():
                  d['ts'] = ts
                  if ticker not in mdata['stocks']:
                      mdata['stocks'][ticker] = {}
                  mdata['stocks'][ticker].update(d)

              if 'indices' not in mdata: mdata['indices'] = {}
              mdata['indices'].update(indices)
              mdata['updated_at']         = now.isoformat()
              mdata['updated_at_display'] = now.strftime('%Y-%m-%d %H:%M:%S')
              mdata['data_source']        = 'Mubasher.info Live'
              mdata['sync_count']         = len(results)

              with open('market_data.json', 'w', encoding='utf-8') as f:
                  json.dump(mdata, f, ensure_ascii=False, indent=2)

              git_commit_push(ts, len(results))

              # Wait 60s before next iteration (skip on last)
              if iteration < 4:
                  print(f'  Sleeping 58s...')
                  time.sleep(58)

          print('\n✅ All 5 iterations complete!')
          PYEOF
