name: Automated EGX & Funds Market Data Sync

on:
  schedule:
    # 1. Trading Hours Sync: Every 10 minutes during EGX trading session (10:00 - 15:30 Cairo = 07:00 - 12:30 UTC)
    - cron: '*/10 7-12 * * 0,1,2,3,4'
    # 2. Evening Mutual Funds NAV Sync: Every 30 minutes during official Fund NAV disclosures window (17:00 - 21:30 Cairo = 14:00 - 18:30 UTC)
    - cron: '*/30 14-18 * * 0,1,2,3,4'
  workflow_dispatch:

concurrency:
  group: market-data-sync
  cancel-in-progress: true

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live Market Quotes & Update JSON
        run: |
          python update_market_data_cloud.py

      - name: Commit and Push Updated Market Data
        run: |
          git config --global user.name "EGX-Sharia-AutoSync[bot]"
          git config --global user.email "auto-sync@mahereasybakery.internal"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated market data sync [skip ci]" && git push)
