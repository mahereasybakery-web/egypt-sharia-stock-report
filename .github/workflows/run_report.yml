name: Send Sharia Stock Report

on:
  schedule:
    # 08:17 Cairo (05:17 UTC) – Early wake, waits for market open at 08:45
    - cron: '17 5 * * 0,1,2,3,4'
    # 08:47 Cairo (05:47 UTC) – Pre-market opening guarantee
    - cron: '47 5 * * 0,1,2,3,4'
    # 09:47 Cairo (06:47 UTC) – Main trading opening guarantee (opens 10:00 AM)
    - cron: '47 6 * * 0,1,2,3,4'
    # 10:47 Cairo (07:47 UTC) – Mid-morning safety net
    - cron: '47 7 * * 0,1,2,3,4'
    # 11:47 Cairo (08:47 UTC) – Mid-day safety net
    - cron: '47 8 * * 0,1,2,3,4'
    # 12:47 Cairo (09:47 UTC) – Early afternoon safety net
    - cron: '47 9 * * 0,1,2,3,4'
    # 13:47 Cairo (10:47 UTC) – Pre-close session safety net (session closes 14:30)
    - cron: '47 10 * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass time checks and send report immediately'
        required: false
        default: 'true'

concurrency:
  group: report-loop
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser matplotlib

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python report.py
