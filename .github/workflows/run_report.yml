name: Send Sharia Stock Report

on:
  schedule:
    # Resilient cron grid: every 15 minutes on odd minutes (12, 27, 42, 57) from 05:00 to 12:00 UTC (08:00 to 15:00 Cairo)
    # Using non-round minutes completely avoids GitHub Actions top-of-hour congestion and queue drops
    - cron: '12,27,42,57 5-12 * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass time checks and send report immediately'
        required: false
        default: 'true'

concurrency:
  group: report-loop
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser matplotlib

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python report.py
