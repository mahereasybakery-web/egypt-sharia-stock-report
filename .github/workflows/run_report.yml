name: Send Sharia Stock Report

on:
  schedule:
    # Primary: 08:00 Cairo time (UTC+3 = 05:00 UTC) — Early wake, waits for market open at 08:45
    - cron: '0 5 * * 0,1,2,3,4'
    # Backup: 10:00 Cairo time (UTC+3 = 07:00 UTC) — Ensures restart if self-chain breaks
    - cron: '0 7 * * 0,1,2,3,4'
    # Extra backup: 12:00 Cairo (09:00 UTC) — Safety net for mid-session recovery
    - cron: '0 9 * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass time checks and send report immediately'
        required: false
        default: 'true'

concurrency:
  group: report-loop
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python report.py
