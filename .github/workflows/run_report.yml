name: Send Sharia Stock Report

on:
  schedule:
    # Emergency safety-net crons (only fire if the perpetual 24/7 cloud relay was somehow stopped):
    # 08:47 Cairo (05:47 UTC) - Pre-market opening backup
    - cron: '47 5 * * 0,1,2,3,4'
    # 09:47 Cairo (06:47 UTC) - Main trading opening backup
    - cron: '47 6 * * 0,1,2,3,4'
    # 12:47 Cairo (09:47 UTC) - Mid-day session backup
    - cron: '47 9 * * 0,1,2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass time checks and send report immediately'
        required: false
        default: 'true'

concurrency:
  group: report-loop
  cancel-in-progress: true

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser matplotlib

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python report.py
