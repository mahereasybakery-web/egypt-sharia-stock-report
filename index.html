<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إيقاف هذا المستودع القديم - جاري التحويل للنسخة الجديدة</title>
    <meta http-equiv="refresh" content="1; url=https://mahereasybakery-web.github.io/egx-sharia-portal-ui/">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 text-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 space-y-6 shadow-2xl">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-3xl">
            🚀
        </div>
        <div class="space-y-2">
            <h1 class="text-xl font-bold text-white">تم استبعاد هذا المستودع القديم نهائياً</h1>
            <p class="text-xs text-slate-400 leading-relaxed">
                تم نقل واعتماد بوابة الأسهم الشرعية رسمياً على المستودع الجديد المحدث. جاري نقلك تلقائياً الآن...
            </p>
        </div>
        
        <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800 text-xs font-mono text-emerald-400">
            https://mahereasybakery-web.github.io/egx-sharia-portal-ui/
        </div>

        <div class="pt-2">
            <a id="redirectLink" href="https://mahereasybakery-web.github.io/egx-sharia-portal-ui/" class="inline-flex items-center justify-center gap-2 w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg transition active:scale-95">
                <span>انتقل فوراً إلى المنظومة الجديدة</span>
                <span>←</span>
            </a>
        </div>
    </div>

    <script>
        // 1. Unregister any existing old service workers and purge all old caches
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister();
                }
            });
        }
        if ('caches' in window) {
            caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
            });
        }

        // 2. Preserve any hash (e.g. #tab-dailyreport, #tab-news_hub) and redirect immediately
        var targetBase = 'https://mahereasybakery-web.github.io/egx-sharia-portal-ui/';
        var currentHash = window.location.hash || '';
        var finalTarget = targetBase + currentHash;
        
        var linkEl = document.getElementById('redirectLink');
        if (linkEl) linkEl.href = finalTarget;

        setTimeout(function() {
            window.location.replace(finalTarget);
        }, 300);
    </script>
</body>
</html>
